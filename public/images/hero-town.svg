      <path d="M1036 428 L1126 392 L1188 392 L1098 428 Z"/>
      <path d="M1104 428 L1194 392 L1204 396 L1124 428 Z"/>
    </g>
    <g stroke="#8fa7a6" stroke-width="0.8" opacity="0.5">
      <path d="M990 420 L1080 384"/>
      <path d="M1058 420 L1148 384"/>
    </g>
    <rect x="962" y="690" width="238" height="10" fill="#0f1516"/>
    <rect x="1000" y="690" width="160" height="4" fill="#e9cba4" opacity="0.3"/>
  </g>

  <!-- block B -->
  <g>
    <rect x="1222" y="516" width="112" height="184" fill="#1c2426"/>
    <rect x="1232" y="530" width="92" height="160" fill="url(#winB)"/>
    <rect x="1222" y="516" width="112" height="9" fill="#2e3635"/>
  </g>

