  <path d="M0 700 L1330 700 L1330 820 L2400 820 L2400 1100 L0 1100 Z" fill="url(#ground)"/>
  <path d="M0 700 L1330 700 L1330 706 L0 706 Z" fill="#2a3130" opacity="0.6"/>

  <!-- low pavilion (architecture) -->
  <g>
    <path d="M392 700 L392 604 Q560 534 728 604 L728 700 Z" fill="#1b2223"/>
    <path d="M392 604 Q560 534 728 604" fill="none" stroke="#3d4544" stroke-width="3"/>
    <path d="M420 700 L420 618 Q560 560 700 618 L700 700 Z" fill="url(#pavilionGlow)"/>
    <g stroke="#12181a" stroke-width="4" opacity="0.75">
