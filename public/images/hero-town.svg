<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1100" width="2400" height="1100" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080f18"/>
      <stop offset="0.34" stop-color="#122029"/>
      <stop offset="0.6" stop-color="#20343a"/>
      <stop offset="0.78" stop-color="#3b4340"/>
      <stop offset="0.9" stop-color="#6b5b41"/>
      <stop offset="1" stop-color="#8a6f4c"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6d3a2" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#cf9f66" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cf9f66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a3c" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#22343a"/>
      <stop offset="1" stop-color="#0f1a1e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a1c"/>
      <stop offset="0.5" stop-color="#0e1416"/>
      <stop offset="1" stop-color="#090d0e"/>
    </linearGradient>
    <linearGradient id="facadeWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a33"/>
      <stop offset="1" stop-color="#1b2325"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232c2e"/>
      <stop offset="0.45" stop-color="#39433f"/>
      <stop offset="1" stop-color="#1d2527"/>
    </linearGradient>
    <linearGradient id="pavilionGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d2a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e9cba4" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="pathGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9cba4" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#f3d6ab" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#e9cba4" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <pattern id="winA" width="30" height="34" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="16" height="18" rx="1.5" fill="#f0cfa2" opacity="0.42"/>
    </pattern>
    <pattern id="winB" width="24" height="26" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="12" height="13" rx="1.2" fill="#e9cba4" opacity="0.3"/>
    </pattern>
    <pattern id="winDim" width="28" height="30" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="14" height="15" rx="1.2" fill="#8fa3a0" opacity="0.18"/>
    </pattern>
    <filter id="soft20" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="soft8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="2400" height="1100" fill="url(#sky)"/>
  <circle cx="1640" cy="630" r="460" fill="url(#sunGlow)"/>
  <circle cx="1980" cy="172" r="46" fill="#f5e6cf" opacity="0.10" filter="url(#soft20)"/>
  <circle cx="1980" cy="172" r="13" fill="#f7ecda" opacity="0.75"/>
  <g fill="#e6ecec" opacity="0.35">
