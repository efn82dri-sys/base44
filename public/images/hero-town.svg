    <rect x="1758" y="288" width="188" height="12" fill="#3d4543"/>
    <rect x="1772" y="322" width="160" height="3" fill="#e9cba4" opacity="0.35"/>
    <rect x="1772" y="418" width="160" height="2" fill="#e9cba4" opacity="0.22"/>
    <rect x="1772" y="520" width="160" height="2" fill="#e9cba4" opacity="0.18"/>
  </g>

