  <g>
    <rect x="1758" y="298" width="188" height="402" fill="url(#towerGrad)"/>
    <rect x="1772" y="318" width="160" height="372" fill="url(#winB)" opacity="0.55"/>
    <g stroke="#151c1e" stroke-width="7" opacity="0.9">
