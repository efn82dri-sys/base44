      <path d="M1794 298 L1794 700"/>
      <path d="M1818 298 L1818 700"/>
      <path d="M1842 298 L1842 700"/>
      <path d="M1866 298 L1866 700"/>
      <path d="M1890 298 L1890 700"/>
      <path d="M1914 298 L1914 700"/>
      <path d="M1938 298 L1938 700"/>
