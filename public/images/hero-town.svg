  <rect x="2000" y="614" width="96" height="80" fill="url(#winDim)"/>
  <rect x="2136" y="590" width="64" height="104" fill="url(#winDim)"/>

  <!-- trees / planting -->
  <g fill="#243026">
    <ellipse cx="380" cy="726" rx="54" ry="34"/>
    <ellipse cx="470" cy="742" rx="40" ry="26"/>
    <ellipse cx="742" cy="716" rx="46" ry="30"/>
    <ellipse cx="940" cy="736" rx="58" ry="34"/>
    <ellipse cx="1180" cy="726" rx="44" ry="28"/>
    <ellipse cx="1330" cy="746" rx="62" ry="36"/>
    <ellipse cx="1700" cy="734" rx="50" ry="30"/>
    <ellipse cx="2000" cy="748" rx="70" ry="38"/>
    <ellipse cx="2280" cy="740" rx="80" ry="42"/>
  </g>
  <g fill="#37452f" opacity="0.85">
    <ellipse cx="366" cy="712" rx="38" ry="24"/>
    <ellipse cx="944" cy="722" rx="40" ry="24"/>
    <ellipse cx="1996" cy="734" rx="48" ry="26"/>
  </g>

  <!-- illuminated path -->
  <g fill="none" stroke-linecap="round">
    <path d="M300 1100 C 560 962 760 940 1010 862 S 1460 792 1780 776" stroke="url(#pathGlow)" stroke-width="26" opacity="0.35" filter="url(#soft8)"/>
    <path d="M300 1100 C 560 962 760 940 1010 862 S 1460 792 1780 776" stroke="#f3d6ab" stroke-width="3.5" opacity="0.55"/>
  </g>
  <g fill="#e9cba4" opacity="0.8">
    <circle cx="1010" cy="862" r="3"/>
    <circle cx="1290" cy="820" r="2.4"/>
    <circle cx="1560" cy="792" r="2.2"/>
    <circle cx="730" cy="944" r="2.2"/>
  </g>

  <!-- foreground terraces -->
  <path d="M0 940 C 240 916 420 980 640 1000 S 1040 1010 1240 1080 L1240 1100 L0 1100 Z" fill="#0b1011" opacity="0.9"/>
  <path d="M1500 1100 C 1620 1040 1780 1010 1980 1014 S 2260 1050 2400 1030 L2400 1100 Z" fill="#0b1011" opacity="0.85"/>

  <rect width="2400" height="1100" fill="url(#vignette)"/>
</svg>
