      <path d="M520 700 L520 578"/>
      <path d="M570 700 L570 570"/>
      <path d="M620 700 L620 578"/>
      <path d="M670 700 L670 596"/>
    </g>
    <ellipse cx="560" cy="700" rx="170" ry="18" fill="#f0cfa2" opacity="0.18" filter="url(#soft8)"/>
    <path d="M728 690 L840 676 L840 700 L728 700 Z" fill="#161d1f"/>
  </g>

  <!-- mixed-use block A -->
  <g>
    <rect x="772" y="470" width="176" height="230" fill="url(#facadeWarm)"/>
    <rect x="782" y="486" width="156" height="206" fill="url(#winA)"/>
    <rect x="772" y="470" width="176" height="12" fill="#2b3334"/>
    <rect x="866" y="446" width="88" height="26" fill="#1d2527"/>
    <rect x="876" y="452" width="68" height="12" fill="url(#winB)" opacity="0.7"/>
  </g>

  <!-- PV building (energy) -->
  <g>
    <rect x="962" y="430" width="238" height="270" fill="#222a2b"/>
    <rect x="972" y="452" width="218" height="238" fill="url(#winA)" opacity="0.9"/>
    <rect x="962" y="430" width="238" height="14" fill="#39413f"/>
