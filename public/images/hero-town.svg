    <rect x="1760" y="740" width="220" height="3" fill="#e9cba4" opacity="0.18"/>
    <rect x="1750" y="770" width="250" height="2" fill="#e9cba4" opacity="0.14"/>
  </g>

  <!-- distant city -->
  <g fill="#0d171c" opacity="0.9">
    <rect x="700" y="614" width="46" height="86"/>
    <rect x="754" y="588" width="34" height="112"/>
    <rect x="796" y="626" width="58" height="74"/>
    <rect x="1240" y="606" width="44" height="94"/>
    <rect x="1292" y="636" width="66" height="64"/>
    <rect x="1996" y="612" width="52" height="88"/>
    <rect x="2056" y="586" width="38" height="114"/>
    <rect x="2102" y="628" width="74" height="72"/>
  </g>
  <g opacity="0.5">
    <rect x="704" y="620" width="38" height="76" fill="url(#winDim)"/>
    <rect x="2000" y="618" width="44" height="80" fill="url(#winDim)"/>
  </g>

