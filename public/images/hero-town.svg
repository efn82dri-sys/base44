    <circle cx="640" cy="120" r="1.6"/>
    <circle cx="980" cy="210" r="1.8"/>
    <circle cx="1320" cy="140" r="1.4"/>
    <circle cx="1720" cy="250" r="1.6"/>
    <circle cx="2180" cy="190" r="1.8"/>
  </g>

  <!-- far mountains -->
  <path d="M0 640 L130 566 L268 486 L392 542 L528 452 L668 516 L790 440 L918 512 L1058 462 L1198 528 L1338 466 L1478 526 L1618 474 L1758 536 L1898 486 L2040 546 L2180 494 L2400 566 L2400 720 L0 720 Z" fill="#16242c" opacity="0.92"/>
  <path d="M0 700 L180 640 L340 690 L520 622 L700 686 L880 626 L1060 690 L1240 632 L1420 696 L1620 644 L1820 704 L2040 650 L2240 706 L2400 664 L2400 760 L0 760 Z" fill="#0f1a20" opacity="0.95"/>
  <ellipse cx="1200" cy="690" rx="1200" ry="60" fill="#cfd8d2" opacity="0.06" filter="url(#soft20)"/>

