<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img">
  <defs>
    <linearGradient id="rSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1520"/>
      <stop offset="0.55" stop-color="#22343a"/>
      <stop offset="1" stop-color="#6b5c42"/>
    </linearGradient>
    <linearGradient id="rBlock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333c3b"/>
      <stop offset="1" stop-color="#1a2223"/>
    </linearGradient>
    <linearGradient id="rBalcony" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d8ac" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c99c6b" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="rGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22282a"/>
      <stop offset="1" stop-color="#0a0f10"/>
    </linearGradient>
    <radialGradient id="rSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6d3a2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f6d3a2" stop-opacity="0"/>
    </radialGradient>
    <filter id="rBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <radialGradient id="rVig" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#rSky)"/>
  <circle cx="300" cy="480" r="320" fill="url(#rSun)"/>
  <path d="M0 500 L200 430 L400 494 L600 426 L820 500 L1040 436 L1240 504 L1400 450 L1400 620 L0 620 Z" fill="#14222a"/>

  <!-- residential slab with stacked balconies -->
  <g>
    <rect x="250" y="180" width="900" height="470" fill="url(#rBlock)"/>
    <rect x="250" y="180" width="900" height="14" fill="#414a47"/>

    <!-- balcony bands -->
    <g>
      <g fill="url(#rBalcony)" opacity="0.75">
        <rect x="276" y="222" width="848" height="34"/>
        <rect x="276" y="308" width="848" height="34"/>
        <rect x="276" y="394" width="848" height="34"/>
        <rect x="276" y="480" width="848" height="34"/>
        <rect x="276" y="566" width="848" height="34"/>
      </g>
      <!-- balcony soffits / shadows -->
      <g fill="#0f1617" opacity="0.85">
        <rect x="276" y="256" width="848" height="10"/>
        <rect x="276" y="342" width="848" height="10"/>
        <rect x="276" y="428" width="848" height="10"/>
        <rect x="276" y="514" width="848" height="10"/>
        <rect x="276" y="600" width="848" height="10"/>
      </g>
      <!-- vertical mullions -->
      <g stroke="#1a2122" stroke-width="6" opacity="0.8">
        <path d="M340 222 V634 M430 222 V634 M520 222 V634 M610 222 V634 M700 222 V634 M790 222 V634 M880 222 V634 M970 222 V634 M1060 222 V634"/>
      </g>
      <!-- balcony railings -->
      <g stroke="#8b948e" stroke-width="2" opacity="0.45">
        <path d="M276 244 H1124 M276 330 H1124 M276 416 H1124 M276 502 H1124 M276 588 H1124"/>
      </g>
    </g>
  </g>

  <!-- stair core -->
  <g>
    <rect x="600" y="150" width="200" height="500" fill="#2a3334"/>
    <rect x="620" y="180" width="160" height="450" fill="#141c1d"/>
    <g fill="#e9cba4" opacity="0.35">
      <rect x="632" y="196" width="136" height="12"/>
      <rect x="632" y="276" width="136" height="12"/>
      <rect x="632" y="356" width="136" height="12"/>
      <rect x="632" y="436" width="136" height="12"/>
      <rect x="632" y="516" width="136" height="12"/>
    </g>
  </g>

  <!-- low pavilion -->
  <g>
    <rect x="1160" y="470" width="200" height="180" fill="#1c2425"/>
    <rect x="1176" y="492" width="168" height="60" fill="url(#rBalcony)" opacity="0.5"/>
  </g>

  <!-- landscaping / ground -->
  <path d="M0 650 L1400 650 L1400 900 L0 900 Z" fill="url(#rGround)"/>
  <ellipse cx="700" cy="668" rx="540" ry="24" fill="#e9cba4" opacity="0.16" filter="url(#rBlur)"/>
  <g fill="#1e2822">
    <ellipse cx="120" cy="712" rx="80" ry="32"/>
    <ellipse cx="1260" cy="706" rx="88" ry="34"/>
    <ellipse cx="420" cy="736" rx="56" ry="24"/>
    <ellipse cx="980" cy="740" rx="60" ry="24"/>
  </g>
  <g stroke="#e9cba4" stroke-width="3" opacity="0.22">
    <path d="M0 780 H1400"/>
  </g>
  <rect width="1400" height="900" fill="url(#rVig)"/>
</svg>
