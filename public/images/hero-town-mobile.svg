<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img">
  <defs>
    <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080f18"/>
      <stop offset="0.4" stop-color="#13222a"/>
      <stop offset="0.66" stop-color="#2a3a3d"/>
      <stop offset="0.84" stop-color="#6a5a41"/>
      <stop offset="1" stop-color="#8a6f4c"/>
    </linearGradient>
    <radialGradient id="msun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6d3a2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#cf9f66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b1d"/>
      <stop offset="1" stop-color="#080c0d"/>
    </linearGradient>
    <linearGradient id="mpav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d2a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e9cba4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="mwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a3c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0f1a1e"/>
    </linearGradient>
    <pattern id="mwin" width="26" height="30" patternUnits="userSpaceOnUse">
      <rect x="5" y="7" width="14" height="15" rx="1.4" fill="#f0cfa2" opacity="0.4"/>
    </pattern>
    <filter id="mblur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="mblurS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="mvig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#msky)"/>
  <circle cx="640" cy="700" r="330" fill="url(#msun)"/>
  <circle cx="700" cy="150" r="30" fill="#f5e6cf" opacity="0.1" filter="url(#mblur)"/>
  <circle cx="700" cy="150" r="9" fill="#f7ecda" opacity="0.7"/>

  <path d="M0 690 L90 606 L190 660 L300 580 L410 646 L520 592 L640 656 L760 606 L900 672 L900 760 L0 760 Z" fill="#15232b"/>
  <path d="M0 760 L120 706 L250 758 L390 704 L530 760 L680 712 L820 764 L900 738 L900 820 L0 820 Z" fill="#0e191f"/>

  <rect x="470" y="760" width="430" height="120" fill="url(#mwater)"/>

  <!-- pavilion -->
  <path d="M60 820 L60 726 Q235 650 410 726 L410 820 Z" fill="#1b2223"/>
  <path d="M60 726 Q235 650 410 726" fill="none" stroke="#3d4544" stroke-width="3"/>
  <path d="M92 820 L92 742 Q235 678 378 742 L378 820 Z" fill="url(#mpav)"/>
  <g stroke="#12181a" stroke-width="4" opacity="0.75">
    <path d="M130 820 L130 726"/>
    <path d="M190 820 L190 700"/>
    <path d="M250 820 L250 690"/>
    <path d="M310 820 L310 702"/>
    <path d="M370 820 L370 728"/>
  </g>
  <ellipse cx="235" cy="820" rx="180" ry="18" fill="#f0cfa2" opacity="0.2" filter="url(#mblur)"/>

  <!-- PV block -->
  <g>
    <rect x="430" y="596" width="210" height="224" fill="#222a2b"/>
    <rect x="440" y="616" width="190" height="196" fill="url(#mwin)"/>
    <rect x="430" y="596" width="210" height="12" fill="#39413f"/>
    <g fill="#16262f" stroke="#4d5f63" stroke-width="1.3">
      <path d="M436 594 L512 560 L568 560 L492 594 Z"/>
      <path d="M498 594 L574 560 L628 560 L552 594 Z"/>
    </g>
  </g>

  <!-- ribbed tower -->
  <g>
    <rect x="668" y="452" width="150" height="368" fill="#2b3537"/>
    <rect x="680" y="470" width="126" height="340" fill="url(#mwin)" opacity="0.6"/>
    <g stroke="#151c1e" stroke-width="6" opacity="0.9">
      <path d="M680 452 L680 820"/>
      <path d="M700 452 L700 820"/>
      <path d="M720 452 L720 820"/>
      <path d="M740 452 L740 820"/>
      <path d="M760 452 L760 820"/>
      <path d="M780 452 L780 820"/>
      <path d="M800 452 L800 820"/>
    </g>
    <rect x="668" y="442" width="150" height="11" fill="#3d4543"/>
    <rect x="680" y="474" width="126" height="3" fill="#e9cba4" opacity="0.35"/>
  </g>

  <g fill="#243026">
    <ellipse cx="80" cy="840" rx="52" ry="30"/>
    <ellipse cx="400" cy="846" rx="46" ry="28"/>
    <ellipse cx="600" cy="842" rx="56" ry="30"/>
    <ellipse cx="820" cy="850" rx="60" ry="32"/>
  </g>
  <path d="M0 820 L900 820 L900 1200 L0 1200 Z" fill="url(#mground)"/>

  <path d="M120 1200 C 300 1060 400 1030 560 962 S 760 900 900 884" fill="none" stroke="#f3d6ab" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <path d="M120 1200 C 300 1060 400 1030 560 962 S 760 900 900 884" fill="none" stroke="#e9cba4" stroke-width="18" opacity="0.16" filter="url(#mblurS)" stroke-linecap="round"/>

  <path d="M0 1010 C 200 990 340 1060 520 1080 S 780 1090 900 1130 L900 1200 L0 1200 Z" fill="#0a0f10" opacity="0.9"/>
  <rect width="900" height="1200" fill="url(#mvig)"/>
</svg>
